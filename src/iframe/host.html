<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Refinetool — iframe demo</title>
    <style>
      html, body { margin: 0; padding: 0; height: 100%; font-family: system-ui, -apple-system, sans-serif; }
      .layout { display: grid; grid-template-columns: 1fr 360px; height: 100vh; }
      .stage { background: #f1f5f9; padding: 16px; overflow: auto; }
      .stage iframe { width: 100%; height: 100%; border: 0; background: #fff; box-shadow: 0 4px 16px rgba(0,0,0,0.08); border-radius: 8px; }
      #panel { border-left: 1px solid #e2e8f0; background: #fff; }
    </style>
  </head>
  <body>
    <div class="layout">
      <div class="stage">
        <iframe id="artifact" src="/sample-artifact.html" title="artifact"></iframe>
      </div>
      <div id="panel"></div>
    </div>
    <script type="module" src="/src/iframe/main.tsx"></script>
  </body>
</html>
